[project]
name = "zzj-mi"
version = "1.0.0"
description = "Code and data for 'How Language Models Process Negation' (ICML 2026)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Zhejian Zhou" }]
requires-python = ">=3.12"
dependencies = [
    "torch==2.9.1",
    "transformers==4.57.3",
    "tokenizers==0.22.2",
    "safetensors==0.7.0",
    "accelerate==1.13.0",
    "huggingface-hub==0.36.2",
    "datasets==4.8.5",
    "numpy==1.26.4",
    "scipy==1.17.1",
    "scikit-learn==1.8.0",
    "pandas==3.0.3",
    "matplotlib==3.10.9",
    "einops==0.8.2",
    "jaxtyping==0.3.10",
    "fancy-einsum==0.0.3",
    "beartype==0.14.1",
    "better-abc==0.0.3",
    "typeguard==4.5.2",
    "sentencepiece==0.2.1",
    "protobuf==7.35.0",
    "tqdm==4.67.3",
    "regex==2026.5.9",
    "openai==2.21.0",
    "python-dotenv==1.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zzj_mi"]
